name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: automotive_ai_lab
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: automotive_ai_lab
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/automotive_ai_lab

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12.7"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Build the database from the SQL scripts
        run: |
          psql --version
          psql -v ON_ERROR_STOP=1 -f sql/01_schema.sql
          psql -v ON_ERROR_STOP=1 -f sql/02_load.sql
          psql -v ON_ERROR_STOP=1 -f sql/03_views.sql

      - name: Check formatting (Black)
        run: python -m black --check src/db.py src/api.py src/models.py tests

      - name: Lint (Ruff)
        run: python -m ruff check src/db.py src/api.py src/models.py tests

      - name: Run tests
        run: python -m pytest -q
